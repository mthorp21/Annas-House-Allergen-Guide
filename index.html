.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Brand band: the houndstooth with the framed card, straight from the brand banner */
.band{position:relative;isolation:isolate;overflow:hidden;background:var(--band-ground);display:flex;justify-content:center;padding:clamp(20px,5vw,54px) 18px}
.band::before{content:"";position:absolute;inset:-2px;z-index:-1;background:var(--hound);
  -webkit-mask-image:var(--tile);mask-image:var(--tile);
  -webkit-mask-size:var(--tile-size) var(--tile-size);mask-size:var(--tile-size) var(--tile-size);
  -webkit-mask-repeat:repeat;mask-repeat:repeat}
.frame{width:min(440px,100%);background:var(--paper);border:5px solid var(--ah-sage);padding:16px 18px 14px;text-align:center}
@media (min-width:700px){.frame{padding:20px 24px 18px}}
.frame .word{display:block;width:min(240px,72%);height:auto;margin:0 auto}
.frame h1{font:400 clamp(40px,11vw,58px)/.95 var(--display);text-transform:uppercase;letter-spacing:.035em;margin:10px 0 0;
  color:var(--paper);-webkit-text-stroke:1.6px var(--ah-teal-ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ah-teal)}
.frame p{margin:6px 0 0;font-size:14px;line-height:1.35;color:var(--ink-soft)}

/* Sticky tool bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:800px;margin:0 auto;padding:10px 16px}
.r1{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:auto;flex:none}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:22px;background:var(--ground);color:var(--ink);font:400 16px var(--font);padding:0 40px 0 40px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{outline:none;border-color:var(--ah-teal-ink)}
.search input::-webkit-search-cancel-button{display:none}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:16px;border:0;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:18px;line-height:1}
.keybtn{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--paper);font-weight:500;cursor:pointer}
.themebtn{flex:none;width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--paper);color:var(--ah-teal-ink);cursor:pointer;display:grid;place-items:center;padding:0}
.themebtn svg{width:20px;height:20px}
.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .sun{display:block}
:root[data-theme="dark"] .themebtn .moon{display:none}
.chips{display:flex;align-items:center;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 1px 3px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}
.lead{flex:none;font-size:13.5px;color:var(--ink-faint);margin-right:2px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--paper);font-weight:500;font-size:15px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.chip.diet[aria-pressed="true"]{background:var(--ah-sage-ink);border-color:var(--ah-sage-ink);color:var(--paper)}
.chip.reset{border-style:dashed;color:var(--ink-soft)}
.sep{flex:none;width:1.5px;height:22px;background:var(--line);margin:0 2px}

/* Main */
main{max-width:800px;margin:0 auto;padding:14px 16px 28px}
.draft{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1.5px dashed var(--ah-peach);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-soft);margin:0 0 16px}
.draft b{color:var(--ink);font-weight:600}
.draft button{border:0;background:none;padding:0;color:var(--ah-teal-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.hint{font-size:15px;color:var(--ink-soft);margin:0 0 4px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
.tab{--c:var(--ink);--cbg:var(--paper);border:1.5px solid var(--line);border-top:5px solid var(--c);background:var(--paper);border-radius:10px;padding:8px 8px 7px;text-align:left;cursor:pointer;min-height:64px}
.tab .n{display:block;font:600 24px/1 var(--font);color:var(--c)}
.tab .l{display:block;font-size:12.5px;line-height:1.2;color:var(--ink-soft);margin-top:4px}
.tab[aria-selected="true"]{background:var(--cbg);border-color:var(--c)}
.t-none{--c:var(--st-ok);--cbg:var(--st-ok-bg)}
.t-mod{--c:var(--st-mod);--cbg:var(--st-mod-bg)}
.t-ask{--c:var(--st-ask);--cbg:var(--st-ask-bg)}
.t-avoid{--c:var(--st-avoid);--cbg:var(--st-avoid-bg)}
.tabnote{font-size:14px;color:var(--ink-soft);margin:-4px 0 12px}

.sec-h{font:400 36px/1 var(--display);text-transform:uppercase;letter-spacing:.035em;margin:26px 0 10px;
  color:var(--ground);-webkit-text-stroke:1.3px var(--hc-ink);paint-order:stroke fill;text-shadow:2.5px 2.5px 0 var(--hc)}
.sec-h.c0{--hc:var(--ah-teal);--hc-ink:var(--ah-teal-ink)}
.sec-h.c1{--hc:var(--ah-sage);--hc-ink:var(--ah-sage-ink)}
.sec-h.c2{--hc:var(--ah-peach);--hc-ink:#B5632A}
:root[data-theme="dark"] .sec-h.c2{--hc-ink:#F2B98F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-h.c2{--hc-ink:#F2B98F}}
.sec-h:first-child{margin-top:4px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer}
.group .item:first-child{border-top:0}
.item:hover{background:var(--ground)}
.nm{font-weight:500;font-size:16.5px;line-height:1.3}
.ln{grid-column:1/-1;font-size:14px;line-height:1.4;color:var(--ink-soft)}
.ln b{font-weight:600;color:var(--ink)}
.ln .m{color:var(--st-mod);font-weight:500}
.ln .a{color:var(--st-ask);font-weight:500}
.ln .x{color:var(--st-avoid);font-weight:500}
.sec-s{color:var(--ink-faint)}
.tags{display:flex;gap:4px;align-items:flex-start;padding-top:2px}
.tag{font:600 11px/1 var(--font);letter-spacing:.02em;padding:4px 5px 3px;border-radius:3px;color:var(--tag-ink);background:var(--t)}
.tag.GF{--t:var(--ah-teal)} .tag.GFO{--t:var(--ah-peach)} .tag.V{--t:var(--ah-sage)} .tag.VG{--t:var(--ah-butter)}
.empty{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 18px;color:var(--ink-soft)}
.empty b{color:var(--ink)}
.foot{max-width:800px;margin:0 auto;padding:6px 16px 36px;font-size:13.5px;color:var(--ink-faint);display:flex;gap:10px;align-items:center}
.foot img{width:22px;height:auto;opacity:.9}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(640px,100%);max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--paper);border-radius:18px 18px 0 0;transform:translate(-50%,105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);
  padding:0 0 calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
@media (min-width:700px){.sheet{bottom:24px;border-radius:18px;max-height:84vh}}
.sheet .strip{height:14px;background:var(--hound);-webkit-mask-image:var(--tile);mask-image:var(--tile);-webkit-mask-size:56px 56px;mask-size:56px 56px;border-radius:18px 18px 0 0}
.sheet .in{padding:16px 20px 0}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font:600 24px/1.2 var(--font);margin:0}
.close{flex:none;width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:20px;line-height:1}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;font-size:14px;color:var(--ink-faint)}
.desc{margin:12px 0 4px;color:var(--ink-soft);font-size:15.5px}
.sheet h3{font:600 15px/1.3 var(--font);margin:18px 0 6px;color:var(--ink)}
.arow{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:start;margin:0 -20px;padding:10px 20px;border-top:1px solid var(--line)}
.pill{display:inline-block;font:600 12.5px/1 var(--font);padding:6px 9px 5px;border-radius:12px;color:var(--c);background:var(--cbg);white-space:nowrap}
.p-avoid{--c:var(--st-avoid);--cbg:var(--st-avoid-bg)} .p-ask{--c:var(--st-ask);--cbg:var(--st-ask-bg)}
.p-mod{--c:var(--st-mod);--cbg:var(--st-mod-bg)} .p-none{--c:var(--st-ok);--cbg:var(--st-ok-bg)}
.arow .t{font-size:15px;line-height:1.4}
.arow .t b{font-weight:600}
.arow .t .mm{display:block;color:var(--st-mod);font-weight:500;margin-top:2px}
.arow.sel{background:linear-gradient(90deg,var(--ground),transparent)}
.note{background:var(--st-ask-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:14px 0 0}
details.with{border:1px solid var(--line);border-radius:10px;margin:8px 0 0}
details.with summary{cursor:pointer;padding:10px 12px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.with summary::after{content:"+";color:var(--ink-faint);font-size:18px;line-height:1}
details.with[open] summary::after{content:"−"}
details.with summary::-webkit-details-marker{display:none}
.wl{padding:0 12px 8px}
.wl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.wl span{color:var(--ink-soft);text-align:right}
.caveat{font-size:13.5px;color:var(--ink-faint);margin:18px 0 0;border-top:1px solid var(--line);padding-top:12px}
.klist{margin:6px 0 0;padding:0;list-style:none}
.klist li{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.qlist{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.qlist li{margin:0 0 8px}
.src{font-size:13.5px;color:var(--ink-faint);margin-top:14px}

@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}
@media (min-width:700px){:root{--tile-size:168px}}
</style>
</head>

  ['GF Cinnamon Roll','The website says dairy free. The Summer 2026 print menu dropped dairy from the free from list.'],
  ['Baked Chilaquiles','Tagged GF on the 2025 menu, no GF tag now. Is the enchilada sauce gluten free?'],

/* ---------- Logic ---------- */
const RANK={none:0,mod:1,ask:2,avoid:3};
const ST={none:{l:'None listed',cls:'none'},mod:{l:'Can modify',cls:'mod'},ask:{l:'Ask kitchen',cls:'ask'},avoid:{l:'Contains',cls:'avoid'}};
D.forEach((it,i)=>{it.i=i;it.tags=it.t?it.t.split(' '):[];it.hay=(it.n+' '+it.d+' '+SECN[it.s]).toLowerCase()});

function statusFor(it,k){
  let s='none',why='',mod='';
  const v=it.a[k];
  if(v){const [st,r,m]=v.split('|');why=r||'';mod=m||'';s=st==='c'?(m?'mod':'avoid'):'ask'}
  if(s!=='avoid'){
    for(const w of it.w||[]){
      const r=WITH[w].risk[k]; if(!r)continue;
      if(RANK[r[0]]>RANK[s]){s=r[0];why=WITH[w].label;mod=r[1]}
      else if(RANK[r[0]]===RANK[s]&&s!=='none'){why=why?why+', '+WITH[w].label.toLowerCase():WITH[w].label;mod=mod?mod+'. '+r[1]:r[1]}
    }
  }
  return {s,why,mod};
}
function groupFor(it,keys){let g='none';for(const k of keys){const r=statusFor(it,k).s;if(RANK[r]>RANK[g])g=r}return g}

const state={sel:new Set(),diet:new Set(),q:'',tab:'none'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inSection(it,s){return it.s===s||it.also===s}
function visible(){
  const q=state.q.trim().toLowerCase();
  return D.filter(it=>{
    if(state.diet.has('VG')&&!it.tags.includes('VG'))return false;
    if(state.diet.has('V')&&!(it.tags.includes('V')||it.tags.includes('VG')))return false;
    if(q&&!q.split(/\s+/).every(w=>it.hay.includes(w)))return false;
    return true;
  });
}
function tagsHtml(it){return it.tags.length?'<span class="tags">'+it.tags.map(t=>'<span class="tag '+t+'">'+t+'</span>').join('')+'</span>':'<span></span>'}
function summaryLine(it){
  const av=[],md=[],ak=[];
  AL.forEach(a=>{const r=statusFor(it,a.k).s;if(r==='avoid')av.push(a.name.toLowerCase());else if(r==='mod')md.push(a.name.toLowerCase());else if(r==='ask')ak.push(a.name.toLowerCase())});
  const parts=[];
  if(av.length)parts.push('<b>Contains</b> '+av.join(', '));
  if(md.length)parts.push('<span class="m">Can modify: '+md.join(', ')+'</span>');
  if(ak.length)parts.push('<span class="a">Ask: '+ak.join(', ')+'</span>');
  return parts.length?parts.join('. '):'No allergens listed';
}
function filteredLine(it,keys){
  const parts=[];
  keys.forEach(k=>{const r=statusFor(it,k);if(r.s==='none')return;
    const c=r.s==='mod'?'m':r.s==='ask'?'a':'x';
    parts.push('<b>'+ALN[k]+':</b> '+esc(r.why)+(r.mod?'. <span class="'+c+'">'+esc(r.mod)+'</span>':''));
  });
  return parts.length?parts.join(' '):'Nothing listed for '+keys.map(k=>ALN[k].toLowerCase()).join(' or ')+'. Cross contact still possible.';
}
function itemBtn(it,line,showSec){
  return '<button class="item" type="button" data-i="'+it.i+'"><span class="nm">'+esc(it.n)+'</span>'+tagsHtml(it)+
    '<span class="ln">'+(showSec?'<span class="sec-s">'+esc(SECN[it.s])+'. </span>':'')+line+'</span></button>';
}

function renderChips(){
  let h='<span class="lead">Avoiding</span>';
  AL.forEach(a=>{h+='<button type="button" class="chip" data-k="'+a.k+'" aria-pressed="'+state.sel.has(a.k)+'">'+a.name+'</button>'});
  h+='<span class="sep" aria-hidden="true"></span>';
  [['VG','Vegan'],['V','Vegetarian']].forEach(([k,l])=>{h+='<button type="button" class="chip diet" data-d="'+k+'" aria-pressed="'+state.diet.has(k)+'">'+l+'</button>'});
  if(state.sel.size||state.diet.size)h+='<button type="button" class="chip reset" id="reset">Clear all</button>';
  $('chips').innerHTML=h;
}

function render(){
  const items=visible();
  const keys=AL.filter(a=>state.sel.has(a.k)).map(a=>a.k);
  const list=$('list');
  if(!keys.length){
    $('tabs').innerHTML='';
    if(!items.length){list.innerHTML=emptyHtml();return}
    let h='';let ci=0;
    SEC.forEach(([s,name])=>{
      const rows=items.filter(it=>inSection(it,s));
      if(!rows.length)return;
      h+='<h2 class="sec-h c'+(ci++%3)+'">'+esc(name)+'</h2><div class="group">'+rows.map(it=>itemBtn(it,summaryLine(it))).join('')+'</div>';
    });
    list.innerHTML=(state.q?'':'<p class="hint">Tap any dish for the full allergen breakdown.</p>')+h;
    return;
  }
  const groups={none:[],mod:[],ask:[],avoid:[]};
  items.forEach(it=>groups[groupFor(it,keys)].push(it));
  if(!groups[state.tab].length){const first=['none','mod','ask','avoid'].find(g=>groups[g].length);if(first)state.tab=first}
  const names=keys.map(k=>ALN[k].toLowerCase()).join(' or ');
  $('tabs').innerHTML='<div class="tabs" role="tablist" aria-label="Results for '+esc(names)+'">'+['none','mod','ask','avoid'].map(g=>
    '<button type="button" role="tab" class="tab t-'+g+'" data-tab="'+g+'" aria-selected="'+(state.tab===g)+'"><span class="n">'+groups[g].length+'</span><span class="l">'+ST[g].l+'</span></button>').join('')+'</div>'+
    '<p class="tabnote">'+tabNote(state.tab,names)+'</p>';
  const rows=groups[state.tab].sort((a,b)=>SECI[a.s]-SECI[b.s]);
  list.innerHTML=rows.length?'<div class="group">'+rows.map(it=>itemBtn(it,state.tab==='none'?esc(it.d):filteredLine(it,keys),true)).join('')+'</div>':emptyHtml();
}
function tabNote(g,names){
  return {none:'No '+names+' on the menu or in standard recipes. Cross contact is still possible.',
    mod:'Has '+names+' as written. The swap in teal removes it.',
    ask:'Possible '+names+'. A sauce, bread, brand or fryer question for the kitchen.',
    avoid:'Has '+names+' as written, with no menu swap.'}[g];
}
function emptyHtml(){
  return '<div class="empty">'+(state.q?'<b>Nothing matches “'+esc(state.q)+'”.</b> Check the spelling or clear the search.':'<b>No dishes here.</b> Clear a filter to see more.')+'</div>';
}

  lastFocus=document.activeElement;
  $('shBody').innerHTML=html;
  const sh=$('sheet');sh.hidden=false;sh.scrollTop=0;
  requestAnimationFrame(()=>{sh.classList.add('on');$('scrim').classList.add('on')});
  document.body.style.overflow='hidden';
  const c=sh.querySelector('.close');if(c)c.focus({preventScroll:true});
}
function closeSheet(){
  const sh=$('sheet');sh.classList.remove('on');$('scrim').classList.remove('on');document.body.style.overflow='';
  const done=()=>{sh.hidden=true};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)done();else setTimeout(done,340);
  if(lastFocus)lastFocus.focus({preventScroll:true});
}
function head(title,meta){return '<div class="sh-top"><h2 id="shTitle">'+title+'</h2><button class="close" type="button" aria-label="Close">×</button></div>'+(meta||'')}
function itemSheet(i){
  const it=D[i];
  const rows={avoid:[],mod:[],ask:[],none:[]};
  AL.forEach(a=>{const r=statusFor(it,a.k);rows[r.s].push({a,r})});
  let h=head(esc(it.n),'<div class="meta">'+esc(SECN[it.s])+(it.tags.length?tagsHtml(it):'')+'</div>');
  h+='<p class="desc">'+esc(it.d)+'</p><h3>Allergens</h3>';
  ['avoid','mod','ask'].forEach(g=>rows[g].forEach(({a,r})=>{
    h+='<div class="arow'+(state.sel.has(a.k)?' sel':'')+'"><span><span class="pill p-'+g+'">'+ST[g].l+'</span></span><span class="t"><b>'+a.name+'.</b> '+esc(r.why)+(r.mod?'<span class="mm">'+esc(r.mod)+'</span>':'')+'</span></div>';
  }));
  if(rows.none.length)h+='<div class="arow"><span><span class="pill p-none">None listed</span></span><span class="t">'+rows.none.map(x=>x.a.name).join(', ')+'</span></div>';
  if(it.x)h+='<div class="note">'+esc(it.x)+'</div>';
  (it.w||[]).forEach(w=>{
    const opts=D.filter(WITH[w].pick);
    h+='<details class="with"><summary>'+WITH[w].label+'</summary><div class="wl">'+opts.map(o=>'<div><b>'+esc(o.n)+'</b><span>'+shortLine(o)+'</span></div>').join('')+'</div></details>';
  });
  h+='<p class="caveat">Built from the menu text. Shared grills, fryers and prep areas mean cross contact is always possible. Confirm with the kitchen for severe allergies.</p>';
  openSheet(h);
}
function shortLine(it){
  const keys=state.sel.size?AL.filter(a=>state.sel.has(a.k)).map(a=>a.k):AL.map(a=>a.k);
  const out=[];
  keys.forEach(k=>{const r=statusFor(it,k);if(r.s!=='none')out.push((r.s==='avoid'?'':r.s==='ask'?'ask ':'modify ')+ALN[k].toLowerCase())});
  return out.length?out.join(', '):'none listed';
}
function keySheet(){
  let h=head('How to read this guide');
  h+='<ul class="klist">'+
    '<li><span><span class="pill p-none">None listed</span></span><span>Nothing on the menu or in standard recipes points to it. Cross contact is still possible.</span></li>'+
    '<li><span><span class="pill p-mod">Can modify</span></span><span>In the dish as written. A menu supported swap removes it.</span></li>'+
    '<li><span><span class="pill p-ask">Ask kitchen</span></span><span>Possible or unclear. A sauce, bread, brand or fryer question.</span></li>'+
    '<li><span><span class="pill p-avoid">Contains</span></span><span>In the dish as written, with no menu swap.</span></li></ul>';
  h+='<h3>Menu tags</h3><ul class="klist">'+
    '<li><span class="tags"><span class="tag GF">GF</span></span><span>Gluten free ingredients. Anna’s House is not a gluten free environment.</span></li>'+
    '<li><span class="tags"><span class="tag GFO">GFO</span></span><span>Gluten free option available.</span></li>'+
    '<li><span class="tags"><span class="tag V">V</span></span><span>Vegetarian.</span></li>'+
    '<li><span class="tags"><span class="tag VG">VG</span></span><span>Vegan.</span></li></ul>';
  h+='<h3 id="oq">Open questions for the kitchen</h3><ol class="qlist">'+QUESTIONS.map(q=>'<li><b>'+esc(q[0])+'.</b> '+esc(q[1])+'</li>').join('')+'</ol>';
  h+='<p class="src">Built November 20, 2026 from annashouseus.com/menus and the Summer 2026 print menu. Kids, catering and fall feature menus are not in this version.</p>';
  return h;
}

/* ---------- Events ---------- */
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='reset'){state.sel.clear();state.diet.clear()}
  else if(b.dataset.k){const k=b.dataset.k;const was=state.sel.size;state.sel.has(k)?state.sel.delete(k):state.sel.add(k);if(!was)state.tab='none'}
  else if(b.dataset.d){const d=b.dataset.d;state.diet.has(d)?state.diet.delete(d):state.diet.add(d)}
  renderChips();render();
  const nb=b.id==='reset'?null:$('chips').querySelector(b.dataset.k?'[data-k="'+b.dataset.k+'"]':'[data-d="'+b.dataset.d+'"]');if(nb)nb.focus({preventScroll:true});
});
$('q').addEventListener('input',e=>{state.q=e.target.value;$('clr').hidden=!state.q;render()});
$('clr').addEventListener('click',()=>{state.q='';$('q').value='';$('clr').hidden=true;render();$('q').focus()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render();$('tabs').querySelector('[data-tab="'+state.tab+'"]').focus({preventScroll:true})});
$('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)itemSheet(+b.dataset.i)});
$('keyBtn').addEventListener('click',()=>openSheet(keySheet()));
$('qBtn').addEventListener('click',()=>{openSheet(keySheet());const t=$('oq');if(t)setTimeout(()=>t.scrollIntoView({block:'start'}),60)});
$('scrim').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{if(e.target.closest('.close'))closeSheet()});
document.addEventListener('keydown',e=>{
  if($('sheet').hidden)return;
  if(e.key==='Escape')closeSheet();
  if(e.key==='Tab'){const f=[...$('sheet').querySelectorAll('button,summary')];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

function setTheme(t,save){document.documentElement.dataset.theme=t;$('themeBtn').setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');if(save){try{localStorage.setItem('ah-theme',t)}catch(e){}}}
$('themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light',false);

renderChips();render();
</script>
</body>
